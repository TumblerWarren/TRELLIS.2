name: RunPod source checks
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m compileall -q app.py trellis2 scripts tests
      - name: Local regression checks
        run: python -m unittest discover -s tests -v
